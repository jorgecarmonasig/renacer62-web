<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!--no queremos que Google indexe una página de error.-->
    <meta name="robots" content="noindex">

    <title>Página no encontrada | Renacer 62</title>

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="assets/icons/favicon-32x32.png"
    >

    <link
        rel="stylesheet"
        href="assets/css/main.css"
    >
</head>

<body>

    <main class="error-page">

        <div class="container error-page__content">

            <img
                src="assets/icons/favicon-512x512.png"
                alt="Renacer 62"
                class="error-page__logo"
            >

            <p class="error-page__number">404</p>

            <h1>
                Parece que este camino
                <span>todavía no existe.</span>
            </h1>

            <p class="error-page__text">
                La página que buscas no está disponible.
                Puedes regresar al inicio y continuar desde allí.
            </p>

            <a href="/" class="button button--primary">
                Volver al inicio
            </a>

        </div>

    </main>

</body>
</html>
